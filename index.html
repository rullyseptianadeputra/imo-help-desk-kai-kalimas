<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMO Help Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--navy:#2b2a6e;--orange:#e87028;--orange-d:#d15f1b;--bg:#f5f7fb;--card:#fff;--text:#1f2a55;--muted:#7b86a3;--line:#e3e8f1;--zone:#fafbfd;--ok:#1f9d57;--err:#d64545;color-scheme:light}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{background:#fff;border-bottom:1px solid var(--line)}
.hin{max-width:640px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
.hin img{height:44px;width:auto;display:block}
.sep{width:1px;height:36px;background:var(--line)}
.ht b{display:block;font-size:19px;line-height:1.2;font-weight:700;color:var(--navy)}
.ht span{font-size:13px;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:20px 16px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-bottom:16px}
h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:17px;font-weight:700;color:var(--navy)}
h2 svg,.flabel svg{width:20px;height:20px;fill:none;stroke:var(--orange);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.desc{margin:0 0 18px;font-size:14px;color:var(--muted)}
label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
select,input[type=text],input[type=number]{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--zone);color:var(--text);font:inherit}
select:focus,input:focus{outline:2px solid color-mix(in srgb,var(--navy) 35%,transparent);border-color:var(--navy)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pcard{display:none;margin-top:14px;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--zone);border:1px solid var(--line)}
.pcard.show{display:flex}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.pcard b{font-size:14px;font-weight:600}
.pcard .s{font-size:13px;color:var(--muted)}
.tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,#fff);padding:3px 10px;border-radius:99px}
button{font:inherit;cursor:pointer}
.link{margin-top:14px;background:none;border:none;color:var(--navy);padding:0;font-size:13.5px;font-weight:500}
.link:hover{text-decoration:underline}
#addBox{display:none;margin-top:14px;grid-template-columns:1fr 1fr;gap:12px}
#addBox.open{display:grid}
#addBox .full{grid-column:1/-1}
#aSave{height:46px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;align-self:end}
.field{margin-bottom:18px}
.field:last-of-type{margin-bottom:0}
.flabel{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;margin-bottom:8px;color:var(--navy)}
.zone{border:1.5px dashed #cfd6e4;background:var(--zone);border-radius:16px;padding:22px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.zone:hover{border-color:var(--navy)}
.zone.drag{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 6%,#fff)}
.zone.done{border-style:solid;border-color:color-mix(in srgb,var(--ok) 55%,#fff);background:#fff}
.up svg{width:28px;height:28px;fill:none;stroke:#9aa5bf;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.zone.done .up svg{stroke:var(--ok)}
.zt{margin-top:6px;font-weight:600;color:#5d6a8c}
.zh{font-size:12.5px;color:#a3adc4;margin-top:2px}
ul.files{list-style:none;margin:14px 0 0;padding:0;text-align:left;cursor:default}
ul.files li{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
ul.files .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.files button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:2px 8px;font-size:12px}
ul.files button:hover{color:var(--navy);border-color:var(--navy)}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#c3cbdc;flex:none}
.dot.run{background:var(--orange);animation:p 1s infinite}.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}
@keyframes p{50%{opacity:.3}}
.dl{display:none;margin-top:16px}
.dl.show{display:block}
.dl a{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;background:var(--orange);color:#fff;text-decoration:none;font-weight:700;font-size:16px}
.dl a:hover{background:var(--orange-d)}
.dl a svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dl span{display:block;margin-top:10px;font-size:12.5px;color:var(--muted);text-align:center;word-break:break-all}
footer{border-top:1px solid var(--line);background:#fff;margin-top:20px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:var(--muted)}
@media(max-width:480px){.hin img{height:38px}.ht b{font-size:17px}.card{padding:20px 16px}}
</style>
</head>

    ["PPKA","PLR"].forEach(function(j){
      var opts = pegawai.map(function(p,i){return p.jab===j ? '<option value="'+i+'">'+p.nama+' · '+p.nipp+'</option>' : ""}).join("");
      if(opts) html += '<optgroup label="'+j+'">'+opts+'</optgroup>';
    });
    var other = pegawai.map(function(p,i){return (p.jab!=="PPKA"&&p.jab!=="PLR") ? '<option value="'+i+'">'+p.nama+' · '+p.nipp+'</option>' : ""}).join("");
    if(other) html += '<optgroup label="Lainnya">'+other+'</optgroup>';
    $("peg").innerHTML = html;
    if(sel!==undefined) $("peg").value = sel;
    showInfo();
  }
  function curPeg(){var v=$("peg").value;return v===""?null:pegawai[+v]}
  function showInfo(){
    var p = curPeg(), c = $("pcard");
    c.classList.toggle("show", !!p);
    if(!p) return;
    $("pAv").textContent = p.nama.replace(/[^A-Z ]/g,"").trim().split(" ").slice(0,2).map(function(w){return w[0]}).join("");
    $("pNama").textContent = p.nama;
    $("pNipp").textContent = "NIPP " + p.nipp;
    $("pJab").textContent = p.jab;
  }

  var now = new Date();
  $("bln").innerHTML = BULAN.map(function(b,i){return '<option value="'+i+'">'+b+'</option>'}).join("");
  $("bln").value = now.getMonth();
  $("thn").value = now.getFullYear();

  $("toggleAdd").onclick = function(){$("addBox").classList.toggle("open")};
  $("aSave").onclick = function(){
    var n = $("aNama").value.trim().toUpperCase(), p = $("aNipp").value.trim(), j = $("aJab").value;
    if(!n || !/^\d{4,6}$/.test(p)){alert("Isi nama dan NIPP (angka 4–6 digit) dengan benar.");return}
    pegawai.push({nama:n,nipp:p,jab:j});
    saveExtra();
    renderPeg(String(pegawai.length-1));
    $("aNama").value = ""; $("aNipp").value = "";
    $("addBox").classList.remove("open");
    trigger();
  };
  $("peg").onchange = function(){showInfo();trigger()};
  $("bln").onchange = trigger;
  $("thn").onchange = trigger;

  function buildZones(){
    var host = $("zones"); host.innerHTML = "";
    CATS.forEach(function(c){
      var w = document.createElement("div"); w.className = "field";
      w.innerHTML = '<div class="flabel"><span class="ico">'+c.ic+'</span>'+c.title+'</div>'+
        '<div class="zone" id="z_'+c.key+'"><div class="up"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>'+
        '<div class="zt">Klik atau seret file ke sini</div><div class="zh">'+c.hint+'</div>'+
        '<input type="file" hidden multiple accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf"><ul class="files"></ul></div>';
      var z = w.querySelector(".zone");
      var inp = z.querySelector("input");
      z.onclick = function(e){ if(e.target.closest("ul.files")) return; inp.click(); };
      inp.onchange = function(){addFiles(c.key,inp.files);inp.value=""};
      ["dragenter","dragover"].forEach(function(ev){z.addEventListener(ev,function(e){e.preventDefault();z.classList.add("drag")})});
      ["dragleave","drop"].forEach(function(ev){z.addEventListener(ev,function(e){e.preventDefault();z.classList.remove("drag")})});
      z.addEventListener("drop",function(e){addFiles(c.key,e.dataTransfer.files)});
      host.appendChild(w);
    });
  }
  function addFiles(key,list){
    Array.prototype.forEach.call(list,function(f){
      var ok = /\.(pdf|jpe?g|png)$/i.test(f.name) || /^(application\/pdf|image\/(jpeg|png))$/.test(f.type);
      if(ok) files[key].push(f);
    });
    renderList(key); trigger();
  }
  function renderList(key){
    var z = $("z_"+key), ul = z.querySelector("ul");
    z.classList.toggle("done", files[key].length>0);
    ul.innerHTML = "";
    files[key].forEach(function(f,i){
      var li = document.createElement("li");
      li.innerHTML = '<span class="nm"></span><button title="Naik">▲</button><button title="Turun">▼</button><button title="Hapus">✕</button>';
      li.querySelector(".nm").textContent = f.name;
      var b = li.querySelectorAll("button");
      b[0].onclick = function(){move(key,i,-1)};
      b[1].onclick = function(){move(key,i,1)};
      b[2].onclick = function(){files[key].splice(i,1);renderList(key);trigger()};
      ul.appendChild(li);
    });
  }
  function move(key,i,d){
    var a = files[key], j = i+d; if(j<0||j>=a.length) return;
    var t = a[i]; a[i] = a[j]; a[j] = t; renderList(key); trigger();
  }

  function setStatus(kind,text){$("dot").className="dot "+(kind||"");$("msg").textContent=text}
  function hideDl(){
    $("dl").classList.remove("show");
    if(lastUrl){URL.revokeObjectURL(lastUrl);lastUrl=null}
  }

  var timer;
  function trigger(){
    clearTimeout(timer);
    hideDl(); runId++;
    var missing = [];
    if(!curPeg()) missing.push("pegawai");
    CATS.forEach(function(c){if(!files[c.key].length) missing.push(c.title)});
    if(missing.length){setStatus("","Menunggu: "+missing.join(", ")+".");return}
    timer = setTimeout(merge, 300);
  }

  function loadBitmap(file){
    if(window.createImageBitmap) return createImageBitmap(file).catch(function(){return viaImg(file)});
    return viaImg(file);
  }
  function viaImg(file){
    return new Promise(function(res,rej){
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function(){URL.revokeObjectURL(u);res(im)};
      im.onerror = function(){URL.revokeObjectURL(u);rej(new Error("Gambar tidak bisa dibaca: "+file.name))};
      im.src = u;
    });
  }
  async function toJpeg(file){
    var bmp = await loadBitmap(file);
    var w = bmp.width, h = bmp.height, max = 2400, s = Math.min(1, max/Math.max(w,h));
    var cw = Math.round(w*s), ch = Math.round(h*s);
    var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
    var cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0,0,cw,ch); cx.drawImage(bmp,0,0,cw,ch);
    var blob = await new Promise(function(r){cv.toBlob(r,"image/jpeg",0.9)});
    return {bytes: await blob.arrayBuffer(), w: cw, h: ch};
  }

  async function merge(){
    var my = ++runId, P = curPeg();
    setStatus("run","Menggabungkan berkas…");
    try{
      var PDFDocument = PDFLib.PDFDocument, SF = PDFLib.StandardFonts, rgb = PDFLib.rgb;
      var out = await PDFDocument.create();
      var bold = await out.embedFont(SF.HelveticaBold);
      var PW = 841.89, PH = 595.28, M = 28;
      for(var ci=0; ci<CATS.length; ci++){
        var cat = CATS[ci], list = files[cat.key];
        for(var fi=0; fi<list.length; fi++){
          var f = list[fi];
          if(my!==runId) return;
          var isPdf = /\.pdf$/i.test(f.name) || f.type==="application/pdf";
          if(isPdf){
            var src = await PDFDocument.load(await f.arrayBuffer(), {ignoreEncryption:true});
            var pages = await out.copyPages(src, src.getPageIndices());
            pages.forEach(function(pg){out.addPage(pg)});
          }else{
            var img = await toJpeg(f);
            var emb = await out.embedJpg(img.bytes);
            var page = out.addPage([PW,PH]);
            var top = M;
            if(cat.head){
              var tw = bold.widthOfTextAtSize(cat.head,16);
              page.drawText(cat.head,{x:(PW-tw)/2,y:PH-M-8,size:16,font:bold,color:rgb(0,0,0)});
              top = M+26;
            }
            var bw = PW-2*M, bh = PH-top-M;
            var sc = Math.min(bw/img.w, bh/img.h);
            var dw = img.w*sc, dh = img.h*sc;
            page.drawImage(emb,{x:(PW-dw)/2,y:PH-top-bh/2-dh/2,width:dw,height:dh});
          }
        }
      }
      out.setTitle("IMO "+P.nama+" "+BULAN[+$("bln").value]+" "+$("thn").value);
      out.setAuthor("Rully Septian Ade Putra");
      var bytes = await out.save();
      if(my!==runId) return;
      var blob = new Blob([bytes],{type:"application/pdf"});
      lastUrl = URL.createObjectURL(blob);
      var fname = "IMO_"+UNIT+"_-_"+P.nama.replace(/[^A-Z0-9]+/gi,"_").replace(/^_|_$/g,"")+"_"+BULAN[+$("bln").value]+"_"+$("thn").value+".pdf";
      var a = $("dlLink"); a.href = lastUrl; a.download = fname;
      $("dlInfo").textContent = fname+" · "+out.getPageCount()+" halaman · "+(blob.size/1048576).toFixed(2)+" MB";
      $("dl").classList.add("show");
      setStatus("ok","Selesai! PDF siap diunduh dan diunggah ke cloud KAI.");
    }catch(e){
      if(my===runId) setStatus("err","Gagal menggabungkan: "+(e && e.message ? e.message : e));
    }
  }

  buildZones();
  renderPeg();
  setStatus("","Lengkapi data pegawai dan ketiga berkas, PDF akan tergabung otomatis.");
})();
</script>
